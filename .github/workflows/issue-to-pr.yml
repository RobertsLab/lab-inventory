name: issue to pull request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# One run per issue; a quick edit shouldn't race its own earlier run.
concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    # Only from people with repo access. This repo is public, so without the
    # author check anyone on the internet could open issues that spawn branches
    # and PRs. Merge still requires human review either way -- this is about
    # spam, not privilege.
    #
    # There is deliberately NO job-level `if:` here.
    #
    # It used to gate on the `inventory` label, which broke because issue forms
    # silently drop labels that don't exist yet. Replacing that with an
    # author_association check then broke differently: every run skipped, with
    # no log to say why, because a skipped job produces none. Two silent
    # failures from the same construct is enough -- a job-level expression is
    # invisible when it goes wrong, and that is exactly the property we don't
    # want on the one path lab members touch.
    #
    # Both checks now happen in steps, where the values are printed and a
    # refusal can be explained to the person who filed the issue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Printed so a future "nothing happened" is one click to diagnose.
      - name: Check author access
        id: auth
        env:
          ASSOC: ${{ github.event.issue.author_association }}
        run: |
          echo "author_association=$ASSOC"
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR)
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "::notice::author_association=$ASSOC has no repo access" ;;
          esac

      # Idempotent, and the reason a fresh clone of this repo works: the forms
      # can only apply labels that already exist. Runs only for known authors so
      # a stranger's issue can't trigger label writes.
      - name: Ensure the inventory labels exist
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create inventory        --color 0e8a6a --force \
            --description "Filed through an inventory issue form"
          gh label create inventory:add    --color 1d76db --force \
            --description "Add a new item (drives issue-to-pr)"
          gh label create inventory:status --color fbca04 --force \
            --description "Change an item status (drives issue-to-pr)"
          gh label create inventory:verify --color 5319e7 --force \
            --description "Verification pass on a location (drives issue-to-pr)"

      # apply_issue.py reads GITHUB_EVENT_PATH itself. Issue text is never
      # interpolated into a run: block -- `${{ github.event.issue.body }}` in a
      # shell command is a command-injection hole on a public repo.
      - name: Apply the issue to data/items.csv
        id: apply
        run: |
          set +e
          python3 scripts/apply_issue.py --out-dir "$RUNNER_TEMP/pr"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Not an inventory form — stop quietly
        if: steps.apply.outputs.code == '3'
        run: echo "::notice::not an inventory form issue; nothing to do"

      # They filed a real form but can't be acted on. Say so, rather than
      # leaving them to assume it worked.
      - name: Explain that the author needs access
        if: steps.auth.outputs.ok != 'true' && steps.apply.outputs.code != '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          ASSOC: ${{ github.event.issue.author_association }}
        run: |
          # A file rather than an inline --body: this is a two-paragraph message
          # and a heredoc keeps the quoting readable. $ASSOC is a GitHub enum,
          # not user text, so expanding it here is safe.
          cat > "$RUNNER_TEMP/noaccess.md" <<EOF
          Thanks for filing this — the form looks right, but I can't turn it into
          a pull request automatically because your account isn't a member of the
          [RobertsLab org](https://github.com/RobertsLab) yet. GitHub reports you
          as \`$ASSOC\`.

          Ask @sr320 or @kubu4 for an invite, then re-open this and it'll go
          through. They can also apply it by hand in the meantime — **nothing is
          lost, everything you typed is still here.**
          EOF
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/noaccess.md"
          echo "::notice::commented about missing access on #$NUMBER"

      # Backfill what the form couldn't apply, so filtering and future tooling
      # can rely on the labels even though dispatch no longer does.
      - name: Label the issue if the form couldn't
        if: steps.apply.outputs.code == '0' && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" \
            --add-label inventory \
            --add-label "$(cat "$RUNNER_TEMP/pr/action.txt")"

      - name: Report a form problem back to the issue
        if: steps.apply.outputs.code == '2' && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/pr/error.md"
          echo "::error::the issue form needs fixing; commented on #$NUMBER"
          exit 1

      # 0 = applied, 2 = reported to the issue above, 3 = not our form.
      # Anything else is a real bug and should be loud.
      - name: Fail on any other error
        if: >
          steps.apply.outputs.code != '0' &&
          steps.apply.outputs.code != '2' &&
          steps.apply.outputs.code != '3'
        run: |
          echo "::error::apply_issue.py exited ${{ steps.apply.outputs.code }}"
          exit 1

      # Validate before a PR exists rather than after. A PR opened with
      # GITHUB_TOKEN does not trigger other workflows, so validate.yml will not
      # run on it -- this step is the gate.
      - name: Validate the result
        if: steps.apply.outputs.code == '0' && steps.auth.outputs.ok == 'true'
        run: python3 scripts/validate.py

      - name: Open the pull request
        if: steps.apply.outputs.code == '0' && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="inv/issue-$NUMBER"
          TITLE=$(cat "$RUNNER_TEMP/pr/pr_title.txt")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # locations.csv changes too: a verification stamps the location row,
          # which is the only record when the location holds nothing.
          git add data/items.csv data/locations.csv

          # Build the message in a file rather than a heredoc. Item names come
          # from the issue and land in the subject line; keeping them out of
          # shell-parsed text entirely is cheaper than reasoning about quoting.
          {
            printf '%s\n\n' "$TITLE"
            printf 'Applied from issue #%s by the issue-to-pr workflow.\n' "$NUMBER"
          } > "$RUNNER_TEMP/pr/commit_msg.txt"
          git commit --file "$RUNNER_TEMP/pr/commit_msg.txt"

          # Plain --force, not --force-with-lease: each run is a fresh checkout
          # with no remote-tracking ref for this branch, so a lease check would
          # refuse with "stale info" on the edited-issue path. Only this
          # workflow writes inv/* branches.
          git push --force origin "$BRANCH"

          # An edited issue re-runs this job; update the existing PR instead of
          # failing on a duplicate.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr/pr_body.md"
            URL=$(gh pr view "$BRANCH" --json url --jq .url)
            echo "updated $URL"
          else
            URL=$(gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr/pr_body.md")
            gh issue comment "$NUMBER" \
              --body "Opened $URL for review. It'll close this issue when merged."
            echo "created $URL"
          fi
