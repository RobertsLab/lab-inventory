name: issue to pull request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# One run per issue; a quick edit shouldn't race its own earlier run.
concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    # Only inventory forms, and only from people with repo access. This repo is
    # public, so without the author check anyone on the internet could open
    # issues that spawn branches and PRs. Merge still requires human review
    # either way -- this is about spam, not privilege.
    if: >
      contains(github.event.issue.labels.*.name, 'inventory') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # apply_issue.py reads GITHUB_EVENT_PATH itself. Issue text is never
      # interpolated into a run: block -- `${{ github.event.issue.body }}` in a
      # shell command is a command-injection hole on a public repo.
      - name: Apply the issue to data/items.csv
        id: apply
        run: |
          set +e
          python3 scripts/apply_issue.py --out-dir "$RUNNER_TEMP/pr"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report a form problem back to the issue
        if: steps.apply.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/pr/error.md"
          echo "::error::the issue form needs fixing; commented on #$NUMBER"
          exit 1

      - name: Fail on any other error
        if: steps.apply.outputs.code != '0'
        run: |
          echo "::error::apply_issue.py exited ${{ steps.apply.outputs.code }}"
          exit 1

      # Validate before a PR exists rather than after. A PR opened with
      # GITHUB_TOKEN does not trigger other workflows, so validate.yml will not
      # run on it -- this step is the gate.
      - name: Validate the result
        run: python3 scripts/validate.py

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="inv/issue-$NUMBER"
          TITLE=$(cat "$RUNNER_TEMP/pr/pr_title.txt")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # locations.csv changes too: a verification stamps the location row,
          # which is the only record when the location holds nothing.
          git add data/items.csv data/locations.csv

          # Build the message in a file rather than a heredoc. Item names come
          # from the issue and land in the subject line; keeping them out of
          # shell-parsed text entirely is cheaper than reasoning about quoting.
          {
            printf '%s\n\n' "$TITLE"
            printf 'Applied from issue #%s by the issue-to-pr workflow.\n' "$NUMBER"
          } > "$RUNNER_TEMP/pr/commit_msg.txt"
          git commit --file "$RUNNER_TEMP/pr/commit_msg.txt"

          # Plain --force, not --force-with-lease: each run is a fresh checkout
          # with no remote-tracking ref for this branch, so a lease check would
          # refuse with "stale info" on the edited-issue path. Only this
          # workflow writes inv/* branches.
          git push --force origin "$BRANCH"

          # An edited issue re-runs this job; update the existing PR instead of
          # failing on a duplicate.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr/pr_body.md"
            URL=$(gh pr view "$BRANCH" --json url --jq .url)
            echo "updated $URL"
          else
            URL=$(gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr/pr_body.md")
            gh issue comment "$NUMBER" \
              --body "Opened $URL for review. It'll close this issue when merged."
            echo "created $URL"
          fi
