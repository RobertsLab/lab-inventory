name: deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/make_qr_labels.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a later push should win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Data must be valid before it gets published to a public site.
      - name: Validate data
        run: python3 scripts/validate.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build search site
        run: python3 scripts/build_site.py

      # QR payloads must point at wherever Pages actually serves this repo, so
      # take the base URL from configure-pages rather than hardcoding it.
      - name: Build QR label sheet
        run: |
          python3 scripts/make_qr_labels.py \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
